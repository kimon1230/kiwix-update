name: shellcheck

on:
  push:
    branches: [ main ]
  pull_request:

# Least privilege: this job only reads the repo (CWE-732 hardening).
permissions:
  contents: read

# Supersede stale runs on the same ref instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    # Suites are stub-driven (no network); a hang means a bug, not slowness.
    timeout-minutes: 10
    env:
      SHELLCHECK_VERSION: v0.10.0
      SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
      # Manual bump: set the version, then take the sha256 of
      # actionlint_<ver>_linux_amd64.tar.gz from that release's actionlint_<ver>_checksums.txt
      # (copy it from the release page; never compute it from the downloaded tarball).
      ACTIONLINT_VERSION: 1.7.7
      ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
    steps:
      # Pinned to a full commit SHA (not the mutable @v4 tag) to prevent tag
      # hijack from running attacker code in CI. Verify/refresh via Dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; don't leave the token in .git/config.
          persist-credentials: false
      # Exact upstream release, hash-verified — apt's shellcheck floats with the
      # runner image, so a new rule could break CI on an unchanged tree. Bump
      # both env vars together (and re-lint locally) to upgrade.
      - name: Install shellcheck (pinned + hash-verified)
        run: |
          tarball="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${tarball}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      # Exact release, hash-verified (same pattern as shellcheck above).
      - name: Install actionlint (pinned + hash-verified)
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          sudo install -m 0755 "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint
          actionlint -version
      # Lints this workflow itself: expressions, action inputs, and every run:
      # block through the pinned shellcheck (not whichever one is first on PATH).
      - name: actionlint
        # test -x: actionlint silently disables its shellcheck rule if the path is missing.
        run: test -x /usr/local/bin/shellcheck && actionlint -shellcheck=/usr/local/bin/shellcheck
      - name: Syntax check
        run: |
          bash -n kiwix-update.sh
          # Fail fast on a test-suite syntax error before the execution loop.
          find tests -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      # Gate the build at WARNING level so real issues (unquoted expansions,
      # word-splitting, unused vars) fail CI. SC2155 (declare-and-assign) is a
      # deliberate, pervasive style choice in this script and is excluded.
      - name: ShellCheck (warnings gate the build)
        run: shellcheck --severity=warning --exclude=SC2155 kiwix-update.sh
      # The CI test loop below *executes* every tests/*.sh, so the harnesses get the
      # SAME warning-level lint as production (previously they ran unscanned). Same
      # gate as production (--exclude=SC2155 only); SC2034/SC1090 false positives in
      # verify_catalog_v2.sh are quarantined by file-scoped directives in that file,
      # NOT a broad exclude here, so the unused-var/source checks stay live for every
      # other suite. Empty-glob-safe via find -print0 | xargs -0 -r.
      - name: ShellCheck test suites
        run: find tests -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=warning --exclude=SC2155
      # Real aria2c lets verify_catalog_v2.sh check that every option the script
      # passes exists (the suites otherwise use an accept-anything stub; an
      # unsupported flag once made every download fail). Deliberately the distro
      # package, not a pinned build: it should match what users apt-install.
      - name: Install aria2
        run: |
          command -v aria2c >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends aria2; }
          aria2c --version | head -n 1
      # Functional + security regression harnesses: exercise the real functions
      # with stubbed curl/aria2c/service managers (no network — the live smoke is
      # gated behind KIWIX_LIVE, left unset here). The loop auto-picks-up EVERY
      # tests/*.sh so new suites gate CI without editing this workflow. Covered:
      #   verify_catalog_v2.sh   — catalog parse, URL host-pin, transport/SSRF
      #                            policy, download return-code contract, SHA-256
      #                            integrity + disk-fill + update-decision arms,
      #                            real-aria2c option-name check (needs aria2).
      #   verify_unprivileged.sh — trust-gate / run-mode / service-guard security
      #                            suite (M6: previously never ran in CI).
      #   verify_c1_sensitivity.sh — non-vacuity harness for the SHA-256 tests.
      #   verify_library_reconcile.sh — library reconcile: entries outside
      #                            WORK_DIR survive, kiwix-style lexical path
      #                            resolution, smart-update/update-library wiring.
      # ASSUMPTION — keep runs-on a NON-ROOT runner (ubuntu-latest): the unpriv
      # suite self-skips its root-only case but its chmod-555 non-writable-parent
      # assertion only holds as non-root. A root/container runner would break it.
      - name: Run test suites
        run: |
          # SKIP_E2E skips the end-to-end resume cases (only verify_c1_sensitivity.sh
          # sets it, for its own inner run). Inherited here it would hide them.
          [ -z "${SKIP_E2E:-}" ] || { echo "SKIP_E2E is set in CI — refusing to skip the end-to-end tests" >&2; exit 1; }
          for t in tests/*.sh; do
            echo "=== $t ==="
            bash "$t" || exit 1
          done

  # Secret scan of the full git history (not just the tip), so a secret that was
  # committed and later deleted still fails CI. The pre-commit hook only sees
  # local commits by people who installed it; this covers every push and PR.
  # Same version as the pre-commit hook — bump both together.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.21.2
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history
          persist-credentials: false
      # Exact upstream release binary, hash-verified (the gitleaks GitHub Action
      # floats on a tag and needs a license key for organization repos).
      - name: Install gitleaks (pinned + hash-verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
      # --redact keeps any finding's secret out of the public CI log.
      - name: Scan git history for secrets
        run: gitleaks git --redact --no-banner --log-opts="--all" .
